(function(){

var HOLE=/\{\{\s*([^}]+?)\s*\}\}/g, WHOLE=/^\s*\{\{\s*([^}]+?)\s*\}\}\s*$/;
function interp(str,scope){return str.replace(HOLE,function(_,p){var v=look(scope,p);return v==null?'':String(v);});}
function proc(node,scope){
  var kids=Array.prototype.slice.call(node.childNodes);
  kids.forEach(function(n){
    if(n.nodeType===3){if(n.nodeValue.indexOf('{{')>-1)n.nodeValue=interp(n.nodeValue,scope);return;}
    if(n.nodeType!==1)return;
    var tag=n.tagName.toLowerCase();
    if(tag==='sc-if'){var m=(n.getAttribute('value')||'').match(WHOLE);var ok=m?look(scope,m[1]):false;
      if(ok){proc(n,scope);while(n.firstChild)node.insertBefore(n.firstChild,n);} n.remove();return;}
    if(tag==='sc-for'){var lm=(n.getAttribute('list')||'').match(WHOLE);var list=lm?look(scope,lm[1]):[];var as=n.getAttribute('as')||'item';
      (list||[]).forEach(function(it,i){var c=n.cloneNode(true);var sc=Object.create(scope);sc[as]=it;sc.$index=i;proc(c,sc);while(c.firstChild)node.insertBefore(c.firstChild,n);});
      n.remove();return;}
    Array.prototype.slice.call(n.attributes).forEach(function(a){
      if(a.value.indexOf('{{')<0)return;
      if(/^on/i.test(a.name)){var m2=a.value.match(WHOLE);var fn=m2?look(scope,m2[1]):null;n.removeAttribute(a.name);
        if(typeof fn==='function')n.addEventListener(a.name.slice(2).toLowerCase(),function(e){e.preventDefault();fn(e);});return;}
      n.setAttribute(a.name,interp(a.value,scope));});
    proc(n,scope);
  });
}
