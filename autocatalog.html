class Component extends DCLogic {
renderVals(){
const s=this.state||{};
const tabs=(key,list,def)=>list.map((p)=>{const on=(s[key]||def)===p[0];return {label:p[1],on:on,off:!on,pick:()=>this.setState({[key]:p[0]})};});
const v={svcOpen:s.menu==='svc',usefulOpen:s.menu==='useful',
toggleSvc:()=>this.setState({menu:s.menu==='svc'?null:'svc'}),
toggleUseful:()=>this.setState({menu:s.menu==='useful'?null:'useful'})};
v.countryTabs=tabs('country',[['kr','Корея'],['jp','Япония'],['cn','Китай']],'jp');
const B={kr:['Kia','Hyundai','Genesis','SsangYong','Daewoo','Renault Korea'],jp:['Toyota','Nissan','Honda','Mazda','Subaru','Mitsubishi','Suzuki','Lexus','Daihatsu','Isuzu','Infiniti','Mitsuoka'],cn:['Geely','Chery','Haval','Li Auto','BYD','Changan','Exeed','Zeekr']};
const c=s.country||'jp';const br=s.brand||B[c][0];
v.brands=B[c].map((b)=>({name:b,on:b===br,off:b!==br,pick:()=>this.setState({brand:b})}));
v.brand=br;
v.models=['Модель A','Модель B','Модель C','Модель D','Модель E','Модель F','Модель G','Модель H'].map((m)=>({name:br+' · '+m}));
return v;
}
}

window.__mount(Component);
</script>
</body>
</html>
